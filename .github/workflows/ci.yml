# CI do repasse (I0.5 e I0.8 do plano orquestrado; ADR-0001 §4).
name: CI

on:
  pull_request:
  push:
    branches: [main, producao]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualidade:
    name: Lint, tipos, testes e formatação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Dependências pares precisam fechar (ADR-0001 §2.4).
      - run: npm ls
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check

  build:
    name: Build do Next
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

  banco:
    name: Banco (Supabase efêmero, pgTAP e integração)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Subir o Supabase efêmero
        run: npx supabase start
      - name: Exportar as variáveis do Supabase efêmero
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/supabase-status.json"
          node scripts/ci-ambiente-supabase.mjs "$RUNNER_TEMP/supabase-status.json"
      # Banco local: a trava de destino aceita 127.0.0.1 e a conexão não usa TLS.
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run test:integration
      - name: Parar o Supabase
        if: always()
        run: npx supabase stop --no-backup
