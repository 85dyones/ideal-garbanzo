# CI do repasse (I0.8 do plano orquestrado; ADR-0001 §4).
# O job de banco (Supabase efêmero e pgTAP) entra na I0.5, quando existir supabase/.
name: CI

on:
  pull_request:
  push:
    branches: [main, producao]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  qualidade:
    name: Lint, tipos, testes e formatação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Dependências pares precisam fechar (ADR-0001 §2.4).
      - run: npm ls
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check

  build:
    name: Build do Next
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
